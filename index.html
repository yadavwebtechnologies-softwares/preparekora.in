<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="PrepareKora.in — Explore mock tests and prepare for your exams.">
  <title>PrepareKora.in — Mock Tests</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div class="header-inner">

      <a class="brand" href="index.html" aria-label="PrepareKora home">
        <span class="brand-main">preparekora</span><span class="brand-in">.in</span>
      </a>

      <!-- DESKTOP LINKS -->
      <nav class="desktop-nav" aria-label="Desktop navigation">
        <a href="about.html">About</a>
        <a href="find-us.html">Find Us</a>
      </nav>

      <div class="nav-actions">

        <button
          class="icon-button"
          id="searchOpen"
          type="button"
          aria-label="Search mock tests"
          aria-haspopup="dialog"
          aria-controls="searchOverlay"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 4.5 4.5"></path>
          </svg>
        </button>

        <!-- MOBILE HAMBURGER -->
        <button
          class="icon-button"
          id="menuToggle"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="menuPanel"
        >
          <svg id="menuIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 17h16"></path>
          </svg>
        </button>

      </div>

      <!-- MOBILE MENU -->
      <nav class="menu-panel" id="menuPanel" aria-label="Mobile navigation">
        <a href="about.html">About</a>
        <a href="find-us.html">Find Us</a>
      </nav>

    </div>
  </header>

  <main class="page-container">

    <section class="page-heading">
      <h1>Mock Tests</h1>
      <p>Explore mock tests and prepare for your next exam.</p>
    </section>

    <div id="testArchive">

      <section class="archive-section" data-group="today">
        <h2 class="archive-heading">Today</h2>
        <div class="test-list" id="todayTests"></div>
      </section>

      <section class="archive-section" data-group="yesterday">
        <h2 class="archive-heading">Yesterday</h2>
        <div class="test-list" id="yesterdayTests"></div>
      </section>

      <section class="archive-section" data-group="earlier">
        <h2 class="archive-heading">Earlier</h2>
        <div class="test-list" id="earlierTests"></div>
      </section>

      <div class="empty-state" id="archiveEmpty" hidden>
        No mock tests available.
      </div>

    </div>

  </main>

  <footer class="footer">
    <div class="footer-inner">
      <a href="index.html" class="footer-brand">PrepareKora.in</a>

      <div class="footer-copy">
        © <span id="currentYear"></span> PrepareKora.in
      </div>

      <nav class="footer-links" aria-label="Footer navigation">
        <a href="about.html">About</a>
        <a href="find-us.html">Find Us</a>
      </nav>
    </div>
  </footer>

  <!-- SEARCH OVERLAY -->

  <div
    class="search-overlay"
    id="searchOverlay"
    role="dialog"
    aria-modal="true"
    aria-label="Search mock tests"
    aria-hidden="true"
  >
    <div class="search-box">

      <div class="search-top">

        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 4.5 4.5"></path>
          </svg>

          <input
            type="search"
            id="searchInput"
            placeholder="Search tests or teachers..."
            autocomplete="off"
            aria-label="Search tests or teachers"
          >
        </div>

        <button id="searchClose" type="button" aria-label="Close search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12"></path>
            <path d="M18 6 6 18"></path>
          </svg>
        </button>

      </div>

      <div class="search-results" id="searchResults">
        <div class="search-empty">Search for a mock test or teacher.</div>
      </div>

    </div>
  </div>

  <script src="js/main.js"></script>

</body>
</html>
